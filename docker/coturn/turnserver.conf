# coturn STUN/TURN 配置(静态、非机密部分)。
#
# 机密与环境相关项不写进本文件(本文件是只读挂载、进仓库,不含任何密钥):
#   · static-auth-secret(与服务端共享的 HMAC 密钥)→ 由 compose command 以 --static-auth-secret 注入
#   · external-ip(服务器公网 IP)               → 由 compose command 以 --external-ip 注入
# 详见 docs/技术方案/音视频通话-NAT穿透与自建TURN方案.md。

# ── 监听 ──
# STUN/TURN 明文(同端口收 UDP + TCP)
listening-port=3478
# TURNS:TLS over TCP,用于穿严格防火墙(公司网/只放行 443/5349 的网络)
tls-listening-port=5349
fingerprint

# ── 凭据:短期 HMAC(TURN REST API)──
# 客户端凭据由服务端用共享 secret 现算(username=到期时间戳:uid,credential=base64(HMAC-SHA1)),
# coturn 用同一 secret 校验时效与签名。secret 本体由 --static-auth-secret 注入。
use-auth-secret
realm=tujiang.tech

# ── relay 端口段 ──
# 须与云安全组放行的 UDP 段一致。原来只给 40 个(49160-49200),被分配需求耗尽 → 508 no available ports、
# 一端分不到 relay → 媒体单向 → 异网络打不通(见 docs/debug 复盘)。放宽到 1000 个,Lighthouse 防火墙同步放行。
min-port=49160
max-port=50159

# ── TLS 证书(复用 nginx 的 Let's Encrypt,只读挂载 /etc/letsencrypt)──
cert=/etc/letsencrypt/live/tujiang.tech/fullchain.pem
pkey=/etc/letsencrypt/live/tujiang.tech/privkey.pem
no-tlsv1
no-tlsv1_1

# ── 安全硬化 ──
# 关闭 telnet 管理 CLI
no-cli
# 禁止把 TURN 当跳板中继到内网/回环/云元数据(SSRF 式滥用)。
# 原则:只封"确实敏感、且正常 WebRTC peer 不会作为合法目标"的地址;绝不整段封私网/CGNAT/链路本地,
# 否则把合法 peer 候选(手机 CGNAT srflx、家庭 LAN、iOS 链路本地等)拒成 403 Forbidden IP → relay 建不起来
# (实测异网络音视频打不通的根因之一)。
no-multicast-peers
# 回环(host 网络下 coturn 与宿主共享 loopback)
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
# 云元数据服务(会泄露临时密钥),精确到单 IP,不误伤其余链路本地地址
denied-peer-ip=169.254.169.254-169.254.169.254
# 本机 VPC 私网段(宿主 eth0 10.0.0.5/22:10.0.0.0-10.0.3.255),防打同 VPC 邻居
denied-peer-ip=10.0.0.0-10.0.3.255
# docker 网桥段(容器内 postgres/redis/server/gateway/agent 在此)
denied-peer-ip=172.17.0.0-172.20.255.255

# ── 配额(防带宽/会话被打爆)──
# user-quota 放宽:前端每建一个 PeerConnection 会预取 relay 候选池,通话内 reset 又会重建,
# 短时间内单用户开的 allocation 远超旧值 12 → 被 486 Allocation Quota Reached 拒掉真正通话用的 relay
# (实测异网络打不通的根因之一)。前端已同步把 iceCandidatePoolSize 降到 0 减少无谓分配。
user-quota=100
total-quota=500
