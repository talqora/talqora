# our-chat 本地开发:只起中间件(postgres + redis + minio),业务跑在宿主机热重载
#
# 推荐用仓库根的 Makefile 一键起全部:make dev(集中 dev env 在 docker/.env.debug)
# 本文件单独用:make middleware,或 cd docker && docker compose -f docker-compose.dev.yml up -d
name: our-chat

services:
  postgres:
    image: postgres:16-alpine
    container_name: our-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-our_chat}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-our_chat}']
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: '512mb'
    networks: [our-chat]

  redis:
    image: redis:7-alpine
    container_name: our-chat-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--save', '']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [our-chat]

  # 对象存储:开发用 LocalStack 的 S3(生产用腾讯云 COS,不起本容器)。
  # 为什么不是 MinIO:minio/minio 已从 Docker Hub 下架(2025 年起 pull 报 access denied,
  # quay.io/minio/minio 需登录),会让 `make middleware` 直接失败。
  # LocalStack 提供等价的 S3 兼容端点,业务侧 minio-go 客户端与 S3_* 配置零改动;
  # 对外仍映射到 9000,保持 .env.debug 里的 S3_ENDPOINT/S3_PUBLIC_BASE_URL 不变。
  s3:
    image: localstack/localstack:3
    container_name: our-chat-s3
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-our-chat}
      S3_REGION: ${S3_REGION:-us-east-1}
      PERSISTENCE: '1'
    ports:
      - '${MINIO_PORT:-9000}:4566'
    volumes:
      - s3_data:/var/lib/localstack
      - ./localstack/init-s3.sh:/etc/localstack/init/ready.d/01-init-s3.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [our-chat]

volumes:
  postgres_data:
    name: our-chat-postgres-data
  s3_data:
    name: our-chat-s3-data

networks:
  our-chat:
    driver: bridge
