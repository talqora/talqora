name: proto

# 契约防漂移:校验 proto 规范、不兼容变更、以及各端生成物是否最新。
on:
  pull_request:
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf.gen.biz.yaml'
      - 'openapi/**'
      - 'web/src/contracts/gen/**'
      - 'gateway/internal/contracts/gen/**'
      - 'biz/internal/contracts/gen/**'
      - 'mobile-swift/Sources/Contracts/Gen/**'
      - 'mobile-swift/openapi-codegen/**'
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf.gen.biz.yaml'
      - 'openapi/**'
      - '.github/workflows/proto.yml'
  workflow_dispatch:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking 需要 main 历史做基线
      # 钉 buf 版本:buf 内置 google/protobuf 等 well-known types 的 proto,不钉版本会随 buf 升级
      # 导致 WKT 生成物(如 timestamp.ts 注释)漂移、freshness 误报。与 ts-proto 插件钉 v2.11.8 同策略。
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.71.0
      - name: Lint
        run: buf lint
      - name: Breaking change check (vs main)
        run: |
          if git cat-file -e main:buf.yaml 2>/dev/null; then
            buf breaking --against '.git#branch=main'
          else
            echo "main 尚无 proto 基线,跳过 breaking 检查(合并到 main 后自动生效)"
          fi
      - name: OpenAPI copy freshness
        run: |
          # swift-openapi-generator 的 build 插件要求契约文件位于 target 源目录内，
          # 因此 mobile-swift 侧保留一份副本。副本必须与单一契约源逐字节一致，
          # 否则 iOS 生成类型会与 web 静默漂移。
          diff -u openapi/openapi.yaml mobile-swift/openapi-codegen/Sources/Contracts/openapi.yaml
      - name: Generated code freshness
        run: |
          # 两套模板：默认模板生成 web/gateway/mobile 目标，biz 用独立模板（go_package 前缀按 module 隔离）。
          buf generate
          buf generate --template buf.gen.biz.yaml
          git diff --exit-code -- \
            web/src/contracts/gen \
            gateway/internal/contracts/gen \
            biz/internal/contracts/gen \
            mobile-swift/Sources/Contracts/Gen
